<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classe e id</title>

    <link rel="stylesheet" href="style01.css">

</head>
<body>
    <h1>Exemplo de Classe e id</h1>

    <p>Paragrafo comum da pagina</p>

    <div> Esta é uma sem formatação</div>

    <br>

    <div class="caixa" id = "aviso">
         Esta div ultiliza a classe caixa e o identificador aviso
    </div>

    <br>
    
    <span> Este é um span sem formatação</span>

    <br><br><br>

    <span class="caixa"> 
        Este é um span ultilizando a classe caixa
    </span>

</body>
</html>
