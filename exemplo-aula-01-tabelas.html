<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Tabelas em html</h1>
    <p>
        As tabelas em hmtl são usadas para organizar dados<br> em linhas e colunas.
    </p>
    <br>
    <hr>
    <br>
    <table border = "1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>25</td>
                <td>São Paulo</td>

                <tr>
                <td>Bruno</td>
                <td>20</td>
                <td>São Paulo</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
