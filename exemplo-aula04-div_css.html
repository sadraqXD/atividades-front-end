<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal {
            background-color: rgba(0, 0, 0, 0.342);
            border: 3px solid purple;
            color: white;
        }
        #segundaria {
            background-color: rgba(83, 153, 219, 0.603);
            border: 3px solid rgb(255, 4, 4);
            color: white;
        }
        hr{
            border: none;
            border-top: 5px solid rgb(0, 0, 0);
            width: 90%;
        }



    </style>
</head>
<body>
   <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
   </div>
   <hr>
   <div id="segundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
