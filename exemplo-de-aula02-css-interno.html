<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudando Classes com CSS</title>

    <style>
        .titulo {
            color: rgb(0, 136, 255);
            text-align: center;
        }

        .caixa01 {
            background-color: rgba(24, 40, 180, 0.5);
            border: 2px solid;
            color: rgb(0, 0, 0);
            padding: 20px;
            margin: 20px;
        }

        .caixa02 {
            background-color: rgb(66, 168, 182);
            border: 2px solid;
            color: rgb(0, 0, 0);
            padding: 20px;
            margin: 20px;
        }
        .paragrafo{
            color: rgb(0, 0, 0);
            font-weight: bold;
        }
        .paragrafo2{
            color: rgb(252, 252, 252);
            background-color: rgba(5, 8, 37, 0.705);
            font-style: oblique;
            padding: 10px;
        }
    </style>

</head>

<body>

    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="caixa01">
        <p class="paragrafo">Este é o primeiro parágrafo da primeira div.</p>
        <p class="paragrafo2">Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="caixa02">
        <p>Este é o único parágrafo da segunda div.</p>
    </div>

</body>
</html>
